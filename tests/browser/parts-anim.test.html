<!doctype html>
<html lang="ko" data-deck="test-anim">
<head>
<meta charset="utf-8">
<title>anim</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="a0"><h2>앞</h2></section>
<section class="slide" id="a1">
  <h2 data-anim="fade-up" id="t">제목</h2>
  <ul data-stagger><li data-anim="pop" id="l0">하나</li><li data-anim="pop" id="l1">둘</li><li data-anim="pop" id="l2">셋</li></ul>
  <p>참가자 <b data-anim="count" id="n">1,234명</b>, 비율 <b data-anim="count" id="r">3.5%</b></p>
  <p><span data-anim="highlight" id="hl">핵심어</span>와 <span data-anim="wipe" id="wp">닦아 내기</span></p>
  <svg viewBox="0 0 100 20" width="200"><path data-anim="draw" id="pth" d="M0 10H100" stroke="#000"/></svg>
</section>
<section class="slide" id="a2">
  <h2 id="e0">자동 등장</h2>
  <p id="e1">첫 문단</p>
  <div style="display:grid;grid-template-columns:1fr 1fr"><p id="e2">왼쪽</p><figure id="e3"><svg viewBox="0 0 10 10" width="40"></svg></figure></div>
  <ul><li id="e4">하나</li><li id="e5">둘</li></ul>
  <div id="box" style="display:grid;border:2px solid #000"><p>상자 안 하나</p><p>상자 안 둘</p></div>
  <p class="step" id="st">단계</p>
  <p data-enter="off" id="off">고정</p>
</section>
<section class="slide" id="a3" data-enter="off"><p id="noauto">이 장은 자동 등장 없음</p></section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => Exploragram._internal;
const $ = (id) => document.getElementById(id);
const anim = (id, pseudo) => getComputedStyle($(id), pseudo || null).animationName;

test('장이 보이면 움직임 이름이 붙는다(나타남·튀어나옴·형광·닦아 내기·선 그리기)', () => {
  Exploragram.go(1);
  eq(anim('t'), 'ch-a-fade-up');
  eq(anim('l0'), 'ch-a-pop');
  eq(anim('hl', '::before'), 'ch-a-hl');
  eq(anim('wp', '::after'), 'ch-a-wipe');
  eq($('pth').getAttribute('pathLength'), '1');
  eq(anim('pth'), 'ch-a-draw');
});
test('묶음은 0.06초씩 늦게', () => {
  eq(['l0', 'l1', 'l2'].map((id) => $(id).style.getPropertyValue('--ch-delay')), ['0.00s', '0.06s', '0.12s']);
});
test('숫자를 세어 올리고 쉼표·소수·단위를 지킨다', async () => {
  Exploragram.go(0); Exploragram.go(1);
  await wait(60);
  await wait(1000);
  eq($('n').textContent, '1,234명');
  eq($('r').textContent, '3.5%');
});
test('다시 보면 처음부터 다시 재생한다', async () => {
  Exploragram.go(0); Exploragram.go(1);
  const a = $('t').getAnimations()[0];
  assert(a && a.currentTime < 200, `restarted ${a && a.currentTime}`);
});
test('자동 등장: 제목·문단·틀 안 칸·목록 항목이 차례로, 꾸민 상자는 통째로', () => {
  Exploragram.go(2);
  const ids = ['e0', 'e1', 'e2', 'e3', 'e4', 'e5', 'box'];
  eq(ids.map((id) => anim(id)), ids.map(() => 'ch-a-fade-up'));
  eq(ids.map((id) => $(id).style.getPropertyValue('--ch-delay')), ['0.00s', '0.12s', '0.24s', '0.36s', '0.48s', '0.60s', '0.72s']);
  eq($('box').querySelector('p').dataset.anim, undefined);
});
test('자동 등장은 단계·data-enter="off"·직접 정한 움직임을 건드리지 않는다', () => {
  eq($('st').dataset.anim, undefined);
  eq($('off').dataset.anim, undefined);
  eq($('noauto').dataset.anim, undefined);
  eq($('t').dataset.enterAuto, undefined);
});
test('움직임 끄기면 재생하지 않고 숫자는 바로 끝 값', async () => {
  await I().Settings.set('motionOff', true);
  Exploragram.go(0); Exploragram.go(1);
  eq(anim('t'), 'none');
  eq($('n').textContent, '1,234명');
  await I().Settings.set('motionOff', false);
});
</script>
</body>
</html>
