<!doctype html>
<html lang="ko" data-deck="test-panels">
<head>
<meta charset="utf-8">
<title>panels</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="p1" data-sec="가" data-title="첫 장 제목"><h2>첫</h2></section>
<section class="slide" id="p2" data-sec="나" data-title="둘"><h2>둘</h2></section>
<section class="slide" id="p3"><h2>제목만 있음</h2></section>
<section class="slide" id="p4"><p>제목 없음</p></section>
<pre id="results" data-summary="pending"></pre>
<script>
const key = (k, opts) => document.dispatchEvent(new KeyboardEvent('keydown', Object.assign({ key: k, bubbles: true, cancelable: true }, opts)));
const $ = (s) => document.querySelector(s);
const visible = (el) => getComputedStyle(el).display !== 'none';

test('목차: data-title이 먼저, 없으면 첫 제목, 그것도 없으면 N쪽', () => {
  const btns = document.querySelectorAll('.ch-toc button');
  eq(btns.length, 4);
  assert(btns[0].textContent.includes('첫 장 제목'), 'data-title first');
  eq(btns[0].querySelector('small').textContent, '가');
  assert(btns[2].textContent.includes('제목만 있음'), 'heading fallback');
  assert(btns[3].textContent.includes('4쪽'), 'page fallback');
  assert(btns[0].classList.contains('is-current'), 'current marked');
  eq(btns[0].getAttribute('aria-current'), 'page');
});
test('T로 목차를 열고 버튼으로 이동하면 닫힌다', () => {
  key('t');
  assert(visible($('.ch-toc')), 'open (visible)');
  document.querySelectorAll('.ch-toc button')[1].click();
  eq(Exploragram._internal.Nav.state.slide, 1);
  assert(!visible($('.ch-toc')), 'closed');
  const b1 = document.querySelectorAll('.ch-toc button')[1];
  assert(b1.classList.contains('is-current'), 'current moved');
  eq(b1.getAttribute('aria-current'), 'page');
});
test('T를 두 번 누르면 닫히고, Ctrl+T는 무시한다', () => {
  key('t');
  key('t');
  assert(!$('.ch-toc').classList.contains('is-open'), 'toggled closed');
  key('t', { ctrlKey: true });
  assert(!$('.ch-toc').classList.contains('is-open'), 'ctrl ignored');
});
test('한글 입력 상태(key가 Process)여도 키 자리로 알아듣는다', () => {
  key('Process', { code: 'KeyT' });
  assert($('.ch-toc').classList.contains('is-open'), 'opened by code');
  key('Escape');
});
test('목차 버튼에서 Enter를 눌러도 넘기기로 가로채지 않는다', () => {
  key('t');
  const before = Exploragram._internal.Nav.state.slide;
  const ev = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
  document.querySelectorAll('.ch-toc button')[2].dispatchEvent(ev);
  eq(ev.defaultPrevented, false);
  eq(Exploragram._internal.Nav.state.slide, before);
  key('Escape');
});
test('목차와 도움말은 동시에 열리지 않고, 닫을 때 panels-close를 알린다', () => {
  let closes = 0;
  Exploragram._internal.on('panels-close', () => { closes += 1; });
  key('t');
  key('?');
  assert(visible($('.ch-help')) && !visible($('.ch-toc')), 'only help open');
  key('Escape');
  assert(!visible($('.ch-help')), 'help closed');
  assert(closes >= 2, `panels-close emitted ${closes} times`);
});
test('B·W로 화면 가리기, 같은 키로 해제', () => {
  key('b'); eq($('.ch-shade').dataset.mode, 'black');
  key('w'); eq($('.ch-shade').dataset.mode, 'white');
  key('w'); eq($('.ch-shade').dataset.mode, '');
});
test('?는 도움말, Esc는 모두 닫기', () => {
  key('?'); assert($('.ch-help').classList.contains('is-open'), 'help open');
  key('b'); key('Escape');
  assert(!$('.ch-help').classList.contains('is-open'), 'help closed');
  eq($('.ch-shade').dataset.mode, '');
});
test('가린 화면을 누르면 해제', () => {
  key('b'); $('.ch-shade').click();
  eq($('.ch-shade').dataset.mode, '');
});
test('키를 누르고 있어도(반복 입력) 깜박이지 않는다', () => {
  key('b');
  key('b', { repeat: true });   // 반복 입력 한 번: 가드가 없으면 꺼져 버린다
  eq($('.ch-shade').dataset.mode, 'black');
  key('b');
  eq($('.ch-shade').dataset.mode, '');
});
test('목차가 열려 있을 때 화면 아무 데나 누르면 닫히고, 그 누름은 아래로 가지 않는다', () => {
  const I = () => Exploragram._internal;
  const deck = I().Stage.deck;
  key('t');
  assert($('.ch-toc').classList.contains('is-open'), 'open');
  let clicked = 0;
  const h2 = $('#p1 h2');
  h2.onclick = () => { clicked += 1; };
  const down = new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 3, clientX: 50, clientY: 50 });
  h2.dispatchEvent(down);
  assert(!$('.ch-toc').classList.contains('is-open'), 'closed');
  eq(down.defaultPrevented, true);
  h2.click();                                // 닫으려고 누른 그 클릭
  eq(clicked, 0);
  h2.click();                                // 다음 클릭은 정상
  eq(clicked, 1);
  h2.onclick = null;
  // 목차 안을 누르면 닫히지 않는다
  key('t');
  $('.ch-toc h2').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true }));
  assert($('.ch-toc').classList.contains('is-open'), 'inside keeps open');
  key('t');
  // 도움말도 같다
  key('?');
  deck.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true }));
  assert(!$('.ch-help').classList.contains('is-open'), 'help closed');
});
</script>
</body>
</html>
