<!doctype html>
<html lang="ko" data-deck="test-particles">
<head>
<meta charset="utf-8">
<title>particles</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="p0"><h2>앞</h2></section>
<section class="slide" id="p1">
  <div class="calc">
    <input type="range" name="sugar" min="0" max="40" value="20" id="sugar">
    <figure class="particles" id="box" data-membrane="0.5" data-labels="세포 밖|세포 안" data-height="240" style="width:600px">
      <i data-kind="물" data-left="30" data-right="30" data-pass="1" data-color="#5AA9E6" data-size="4"></i>
      <i data-kind="설탕" data-left="sugar" data-right="0" data-pass="0" data-color="#C04F15" data-size="8"></i>
    </figure>
  </div>
  <figure class="particles" id="gas" data-height="200" style="width:400px"><i data-kind="기체" data-left="500" data-color="#333"></i></figure>
  <figure class="particles" id="osm" data-membrane="0.5" data-height="240" style="width:600px"><i data-kind="물" data-left="40" data-right="40" data-pass="1"></i><i data-kind="설탕" data-left="0" data-right="20" data-pass="0" data-size="8"></i></figure>
  <figure class="particles" id="mix" data-height="200" style="width:400px"><i data-kind="잉크" data-left="0" data-right="20" data-color="#7A4FBF"></i><i data-kind="물" data-left="20" data-right="0"></i></figure>
  <figure class="particles" id="bad"><i data-kind="x" data-left="1 +"></i></figure>
</section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => ClassHTML._internal;
const it = (id) => I().Particles.list.find((x) => x.fig.id === id);

test('처음 개수대로 양쪽에 놓고 개수를 보인다', () => {
  const b = it('box');
  I().Particles.count(b);
  eq(b.tally, [{ left: 30, right: 30 }, { left: 20, right: 0 }]);
  assert(b.counts.textContent.includes('설탕') && b.counts.textContent.includes('세포 밖 20'), b.counts.textContent);
  eq(b.w, 600);
});
test('막을 못 지나는 설탕은 그대로, 물은 오가며 전체 수는 같다', () => {
  const b = it('box');
  for (let i = 0; i < 400; i++) I().Particles.step(b, 0.03);
  I().Particles.count(b);
  eq(b.tally[1], { left: 20, right: 0 });
  eq(b.tally[0].left + b.tally[0].right, 60);
  assert(b.parts.every((p) => p.x >= 0 && p.x <= 600 && p.y >= 0 && p.y <= 240), 'inside box');
});
test('삼투 모형: 용질(막을 못 지남)이 있는 쪽으로 물이 더 많이 모인다', () => {
  const o = it('osm');
  let right = 0;
  let n = 0;
  for (let i = 0; i < 3000; i++) {
    I().Particles.step(o, 0.03);
    if (i > 1000 && i % 20 === 0) { I().Particles.count(o); right += o.tally[0].right; n += 1; }
  }
  I().Particles.count(o);
  eq(o.tally[1], { left: 0, right: 20 });
  assert(right / n > 43, `water on solute side ${(right / n).toFixed(1)} (of 80)`);
});
test('막이 없으면 한 칸, 입자는 300개까지', () => {
  const g = it('gas');
  eq(g.parts.length, 300);
  assert(g.counts.textContent.includes('300개'), g.counts.textContent);
});
test('막이 없어도 오른쪽 개수를 주면 가운데 기준으로 나눠 놓고 센다', () => {
  const m = it('mix');
  eq(m.tally, [{ left: 0, right: 20 }, { left: 20, right: 0 }]);
  assert(m.parts.filter((p) => p.k === 0).every((p) => p.x >= 200), 'ink on the right half');
  for (let i = 0; i < 600; i++) I().Particles.step(m, 0.03);
  I().Particles.count(m);
  assert(m.tally[0].left > 0, 'ink spreads to the left');
});
test('계산 상자 값이 바뀌면 처음부터 다시 놓는다', () => {
  const b = it('box');
  const s = document.getElementById('sugar');
  s.value = '5'; s.dispatchEvent(new Event('input', { bubbles: true }));
  eq(b.tally[1], { left: 5, right: 0 });
});
test('장이 보이면 움직이고, 넘기면 멈추고, 단추로 멈춘다', () => {
  const b = it('box');
  ClassHTML.go(1);
  assert(b.running, 'running on show');
  b.run.click();
  assert(!b.running, 'paused');
  b.run.click();
  ClassHTML.go(0);
  assert(!b.running, 'stopped on hide');
});
test('움직임 끄기면 저절로 움직이지 않는다', async () => {
  await I().Settings.set('motionOff', true);
  ClassHTML.go(1);
  assert(!it('box').running, 'no autoplay');
  await I().Settings.set('motionOff', false);
});
test('잘못 쓴 식은 점검 오류', () => {
  assert(ClassHTML.audit().errors.some((e) => e.code === 'part' && e.msg.includes('data-left')), 'part error');
});
</script>
</body>
</html>
