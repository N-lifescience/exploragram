<!doctype html>
<html lang="ko" data-deck="test-audit-writing">
<head>
<meta charset="utf-8">
<title>audit writing</title>
<link rel="stylesheet" href="../../engine/class-html.css">
<script defer src="../../engine/class-html.js"></script>
<script src="harness.js"></script>
<style>
/* 2026-10 연수 결과물에서 나온 모양: 장에 붙인 클래스에 display를 준다 */
.section-cover { display: flex; flex-direction: column; justify-content: center; }
.dh-veil { position: absolute; inset: 0; }
</style>
</head>
<body>
<section class="slide" id="w0"><h2>첫 장</h2><p>발표 PPT를 만들어 리로스쿨에 낸다.</p></section>
<section class="slide section-cover" id="w1"><h1>구역 표지</h1></section>
<section class="slide" id="w2" style="display: flex !important"><h2>인라인으로 억지로 드러낸 장</h2></section>
<section class="slide" id="w3"><h2>표</h2><p class="note">원본 PPT의 표를 수업용 표로 재구성함.</p></section>
<section class="slide" id="w4"><p class="kicker">익스플로라그램 01</p><h2>조건과 결론을 바꾸면?</h2>
  <div data-activity id="swap"><button type="button">역</button><button type="button">대우</button><p id="swap-out">q ⟹ p</p></div></section>
<section class="slide" id="w5" data-sec="익스플로라그램 2"><h2>정리</h2><footer>교과서 자료가 있으니 수업용으로만 사용하고 인터넷에 공개하지 마세요.</footer></section>
<section class="slide" id="w6"><h2>문제 1</h2>
  <div class="quiz" data-activity><button class="opt">가</button><button class="opt" data-ok data-why="원본 PPT에서는 이렇게 설명한다.">나</button><button class="opt">다</button></div></section>
<section class="slide" id="w7"><h2>문제 2</h2>
  <div class="quiz"><button class="opt">가</button><button class="opt" data-ok>나</button></div></section>
<section class="slide" id="w8"><h2>문제 3</h2>
  <div class="quiz"><button class="opt">가</button><button class="opt" data-ok>나</button><button class="opt">다</button></div></section>
<section class="slide" id="w9"><h2>그림이 함께 바뀌는 활동</h2>
  <div data-activity><svg viewBox="0 0 100 40" width="400"><circle cx="20" cy="20" r="10"/></svg><button type="button">키우기</button></div></section>
<section class="slide" id="w10"><h2>기준값에서 시작하는 막대</h2>
  <div style="position:relative"><div class="dh-veil" id="v10"><span>막대를 밀어 보자</span></div>
  <input type="range" id="base" min="0" max="10" value="5"></div></section>
<section class="slide" id="w11"><h2>글자를 줄여 넣은 표</h2>
  <table style="font-size:18px"><thead><tr><th>성취기준</th><th>유형</th></tr></thead><tbody><tr><td>가</td><td>선택형</td></tr><tr><td>나</td><td>서답형</td></tr></tbody></table>
  <p style="font-size:18px" id="small-note">표 밖의 작은 글</p></section>
<script>
// 40장을 넘기는 덱(엔진은 defer라 이 스크립트 뒤에 시작한다)
for (let i = 0; i < 31; i++) {
  const s = document.createElement('section');
  s.className = 'slide';
  s.id = `f${i}`;
  s.innerHTML = '<h2>채우는 장</h2>';
  document.body.append(s);
}
</script>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => ClassHTML._internal;
let report;
const warns = (code, slide) => report.warnings.filter((e) => e.code === code && (slide == null || e.slide === slide));

test('장에 display를 준 수업 CSS가 있어도 보고 있지 않은 장은 숨는다', () => {
  eq(getComputedStyle(document.getElementById('w1')).display, 'none');
  I().Nav.go(1);
  eq(getComputedStyle(document.getElementById('w1')).display, 'flex');
  eq(getComputedStyle(document.getElementById('w1')).justifyContent, 'center', '수업 CSS의 배치는 그대로');
  eq(getComputedStyle(document.getElementById('w0')).display, 'none');
  I().Nav.go(0);
});
test('인라인 스타일로 드러낸 장은 오류로 알린다', () => {
  report = ClassHTML.audit();
  const shown = report.errors.filter((e) => e.code === 'slide-shown');
  eq(shown.map((e) => e.slide), [2]);
});
test('학생 화면에 섞인 만드는 쪽 이야기를 종류마다 한 줄로 모아 알린다', () => {
  const w = warns('meta-text');
  const of = (word) => w.find((x) => x.msg.includes(word));
  assert(of('원본 PPT 이야기') && of('원본 PPT 이야기').msg.includes('(4, 7쪽)'), '본문과 보기의 이유(data-why): ' + JSON.stringify(w.map((x) => x.msg)));
  assert(of('만드는 쪽에서 쓰는 이름') && of('만드는 쪽에서 쓰는 이름').msg.includes('(5, 6쪽)'), '꼬리표와 data-sec');
  assert(of('저작권 안내') && of('저작권 안내').msg.includes('(6쪽)'), 'copyright');
  eq(w.length, 3, '수업 내용의 PPT(1쪽)는 그대로 둔다');
  eq(of('원본 PPT 이야기').slide, 3, '첫 쪽으로 간다');
});
test('정답이 모두 같은 자리면 알린다', () => {
  const w = warns('quiz-spot');
  eq(w.length, 1);
  assert(w[0].msg.includes('3개') && w[0].msg.includes('2번'), w[0].msg);
});
test('단추를 누르면 글만 바뀌는 활동은 알리고 활동 장으로 세지 않는다', () => {
  const w = warns('text-only');
  eq(w.map((x) => x.slide), [4]);
  assert(w[0].msg.includes('#swap'), w[0].msg);
  eq(report.info.activityPages, [7, 8, 9, 10, 11]);   // 문제 셋, 그림 활동, 막대. 글만 바뀌는 5쪽은 빠진다
});
test('가림막이 있는 장의 막대는 기준값에서 시작해도 된다', () => {
  eq(warns('not-veiled').length, 0);
});
test('40장을 넘으면 나누라고 알린다', () => {
  const w = warns('long-deck');
  eq(w.length, 1);
  assert(w[0].msg.includes('43장'), w[0].msg);
});
test('작은 글자 표는 칸마다가 아니라 표 하나에 한 번 알린다', () => {
  const tiny = report.errors.filter((e) => e.code === 'tiny-text' && e.slide === 11);
  eq(tiny.length, 2, JSON.stringify(tiny.map((e) => e.msg)));
  assert(tiny.some((e) => e.msg.includes('1번째 표') && e.msg.includes('6칸') && e.msg.includes('18px')), 'table');
  assert(tiny.some((e) => e.msg.includes('#small-note')), 'outside table');
});
</script>
</body>
</html>
