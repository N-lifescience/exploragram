<!doctype html>
<html lang="ko" data-deck="test-audit-notice">
<head>
<meta charset="utf-8">
<title>audit notice</title>
<link rel="stylesheet" href="../../engine/class-html.css">
<script defer src="../../engine/class-html.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="n0"><h2>넘치는 장</h2><div style="height:900px">아주 긴 내용</div></section>
<section class="slide" id="n1"><h2>문제</h2><p>원본 PPT의 표를 재구성함.</p></section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => ClassHTML._internal;
const badge = () => document.querySelector('.ch-toolbar .ch-audit-badge');

test('처음 연 파일에 고칠 곳이 있으면 툴바에 「점검 N」 단추가 뜬다', async () => {
  for (let i = 0; i < 40 && !badge(); i++) await wait(150);
  assert(badge(), 'badge');
  const n = ClassHTML.audit().errors.length;
  assert(n >= 1, 'errors');
  eq(badge().textContent.trim(), `점검 ${n}`);
  eq((await I().Store.get('audit:test-audit-notice')).errors, n);
});
test('⚙ 설정에서도 자동 점검을 열 수 있다(전자칠판에는 D 키가 없다)', () => {
  const item = Array.from(I().Settings.panel().querySelectorAll('.ch-menu-item')).find((b) => b.textContent.startsWith('자동 점검'));
  assert(item, 'menu item');
  item.click();
  assert(I().Audit.panel.classList.contains('is-open'), 'open');
  I().Audit.close();
});
test('AI에게 보낼 말에는 꼭 고칠 것과 살펴볼 것, 지킬 것이 들어간다', () => {
  const text = I().Audit.prompt(ClassHTML.audit());
  assert(text.includes('[꼭 고칠 것]') && text.includes('- 1쪽: 내용이'), text);
  assert(text.includes('[함께 살펴볼 것]') && text.includes('원본 PPT 이야기'), 'warnings');
  assert(text.includes('[지킬 것]') && text.includes('엔진 css·js 두 줄'), 'keep');
});
test('단추를 누르면 점검 창이 열리고, 「이 파일은 그만 알리기」로 끌 수 있다', async () => {
  badge().click();
  const panel = I().Audit.panel;
  assert(panel.classList.contains('is-open'), 'open');
  const buttons = Array.from(panel.querySelectorAll('.ch-audit-btn'));
  eq(buttons.map((b) => b.textContent), ['AI에게 보낼 말 복사', '이 파일은 그만 알리기']);
  buttons[1].click();
  assert(!badge(), 'badge removed');
  eq((await I().Store.get('audit:test-audit-notice')).off, true);
  I().Audit.close();
  I().Audit.toggle();   // 다시 열어도 단추는 돌아오지 않는다
  assert(!badge(), 'stays off');
  eq(panel.querySelectorAll('.ch-audit-btn').length, 1);
  I().Audit.close();
});
</script>
</body>
</html>
