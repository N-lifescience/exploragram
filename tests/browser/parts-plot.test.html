<!doctype html>
<html lang="ko" data-deck="test-plot">
<head>
<meta charset="utf-8">
<title>plot</title>
<link rel="stylesheet" href="../../engine/class-html.css">
<script defer src="../../engine/class-html.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="p0"><h2>앞 장</h2></section>
<section class="slide" id="p1">
  <div class="calc" data-const="k = 8.7" data-let="s = k / v">
    <input type="range" name="v" id="v" min="0.85" max="1.35" step="0.01" value="1">
    <figure class="plot" id="pl" style="width:640px" data-x="0.85, 1.35" data-y="0, 11" data-xlabel="부피" data-ylabel="압력">
      <i data-line="k / x" data-label="삼투압"></i>
      <i data-line="x" data-label="직선" data-dash data-color="#123456"></i>
      <i data-vline="v"></i>
      <i data-point="v, s" data-label="지금"></i>
    </figure>
  </div>
  <figure class="plot" id="inv" style="width:400px" data-x="-1, 1" data-y="-5, 5" data-height="240"><i data-line="1 / x"></i></figure>
  <figure class="plot" id="asy" style="width:400px" data-x="-4, 4" data-y="-5, 5" data-height="240"><i data-line="2 / (x - 0.013) + 1"></i></figure>
  <figure class="plot" id="bad" data-x="3, 1"><i data-line="x +"></i></figure>
</section>
<section class="slide" id="p2">
  <div class="calc" data-let="qd = 900 - p / 5; qs = p / 5 - 300">
    <input type="range" name="p" id="price" min="2000" max="4000" step="500" value="2500">
    <figure class="plot" id="mk" style="width:640px" data-x="0, 600" data-y="1500, 4500" data-ystep="500" data-comma data-xlabel="수량" data-ylabel="가격(원)">
      <i data-line="5 * (900 - x)" data-x="100, 500" data-label="수요"></i>
      <i data-line="p" data-x="min(qd, qs), max(qd, qs)" data-show="qd != qs" data-label="초과량"></i>
      <i data-points="100, 4000; 300, 3000; 500, 2000" data-label="표의 값"></i>
    </figure>
  </div>
</section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => ClassHTML._internal;
const it = (id) => I().Plot.list.find((p) => p.fig.id === id);
const near = (a, b, tol) => assert(Math.abs(a - b) <= tol, `${a} vs ${b}`);
const set = (v) => { const r = document.getElementById('v'); r.value = String(v); r.dispatchEvent(new Event('input', { bubbles: true })); };

test('보이지 않는 장에 있어도 실제 크기로 그린다', () => {
  eq(I().Nav.state.slide, 0);
  eq(it('pl').w, 640);
  eq(it('pl').svg.getAttribute('viewBox'), '0 0 640 340');
  eq(it('inv').h, 240);
});
test('눈금은 1·2·5 간격, 글자는 20px', () => {
  ClassHTML.go(1);
  const ys = Array.from(it('pl').svg.querySelectorAll('.ch-plot-ticks text')).map((t) => t.textContent);
  assert(ys.includes('0') && ys.includes('10'), ys.join(','));
  assert(ys.includes('0.9') || ys.includes('0.95') || ys.includes('1'), 'x ticks');
  const t = it('pl').svg.querySelector('.ch-plot-ticks text');
  eq(getComputedStyle(t).fontSize, '20px');
});
test('곡선은 200칸, 값이 없는 곳에서 끊는다', () => {
  const d = it('pl').layer.querySelector('path').getAttribute('d');
  eq((d.match(/M/g) || []).length, 1);
  eq((d.match(/L/g) || []).length, 200);
  const inv = it('inv').layer.querySelector('path').getAttribute('d');
  eq((inv.match(/M/g) || []).length, 2);
});
test('점근선을 건너는 곳에서는 세로선을 긋지 않는다(분수함수)', () => {
  const d = it('asy').layer.querySelector('path').getAttribute('d');
  eq((d.match(/M/g) || []).length, 2, '점근선 양쪽 두 갈래');
});
test('범례, 점선, 색 지정', () => {
  const items = Array.from(it('pl').legend.children);
  eq(items.map((s) => s.textContent), ['삼투압', '직선']);
  assert(items[1].classList.contains('is-dash'), 'dash legend');
  const paths = it('pl').layer.querySelectorAll('path');
  assert(paths[1].classList.contains('is-dash'), 'dash line');
  assert(paths[1].getAttribute('style').includes('#123456'), 'color');
});
test('계산 상자 값이 바뀌면 표시선과 점이 따라 움직인다', () => {
  const x = () => Number(it('pl').marks.querySelector('line').getAttribute('x1'));
  const before = x();
  set(1.2);
  assert(x() > before, 'vline moved right');
  const c = it('pl').marks.querySelector('circle');
  const expectY = it('pl').h - 64 - ((8.7 / 1.2) / 11) * (it('pl').h - 18 - 64);
  assert(Math.abs(Number(c.getAttribute('cy')) - expectY) < 0.2, 'point y');
  eq(it('pl').marks.querySelector('text').textContent, '지금');
});
test('눈금 간격·천 단위 쉼표, 긴 눈금 글자에 맞춘 왼쪽 여백(세로축 이름과 겹치지 않음)', () => {
  ClassHTML.go(2);
  const mk = it('mk');
  const ys = Array.from(mk.svg.querySelectorAll('.ch-plot-ticks text')).map((t) => t.textContent.replace(/\u2060/g, ''));
  ['2,000', '2,500', '3,000', '4,500'].forEach((t) => assert(ys.includes(t), ys.join(' ')));
  assert(mk.pad.l > 76, `pad ${mk.pad.l}`);
  const label = mk.svg.querySelector('.ch-plot-label[transform]').getBoundingClientRect();
  const left = Math.min(...Array.from(mk.svg.querySelectorAll('.ch-plot-ticks text[text-anchor="end"]')).map((t) => t.getBoundingClientRect().left));
  assert(label.right <= left, `ylabel ${label.right} ticks ${left}`);
});
test('선마다 그릴 범위(data-x), 조건(data-show), 측정값 여러 개(data-points)', () => {
  const mk = it('mk');
  const xs = (d) => (d.match(/[ML](-?[\d.]+) /g) || []).map((m) => Number(m.slice(1)));
  const demand = xs(mk.layer.querySelectorAll('path')[0].getAttribute('d'));
  near(Math.min(...demand), mk.pad.l + (100 / 600) * (640 - mk.pad.l - 18), 0.2);
  near(Math.max(...demand), mk.pad.l + (500 / 600) * (640 - mk.pad.l - 18), 0.2);
  eq(mk.errors.length, 0);
  eq(mk.layer.querySelectorAll('path').length, 2);            // 2,500원: 초과 수요가 있다
  const gap = xs(mk.layer.querySelectorAll('path')[1].getAttribute('d'));   // qs 200 ~ qd 400 구간만
  near(Math.min(...gap), mk.pad.l + (200 / 600) * (640 - mk.pad.l - 18), 0.2);
  near(Math.max(...gap), mk.pad.l + (400 / 600) * (640 - mk.pad.l - 18), 0.2);
  eq(mk.marks.querySelectorAll('circle').length, 3);
  const keys = Array.from(mk.legend.children);
  assert(keys[2].classList.contains('is-dot'), 'dot legend');
  document.getElementById('price').value = '3000';
  document.getElementById('price').dispatchEvent(new Event('input', { bubbles: true }));
  eq(mk.layer.querySelectorAll('path').length, 1);            // 균형: 초과량 선과 범례를 감춘다
  eq(keys[1].hidden, true);
  eq(getComputedStyle(keys[1]).display, 'none');
});
test('잘못 쓴 범위와 식은 오류 목록에', () => {
  const msgs = it('bad').errors.map((e) => e.msg);
  assert(msgs.some((m) => m.startsWith('data-x')), 'range');
  assert(msgs.some((m) => m.startsWith('data-line')), 'line');
});
</script>
</body>
</html>
