<!doctype html>
<html lang="ko" data-deck="test-ink">
<head>
<meta charset="utf-8">
<title>ink</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
<script src="pointer.js"></script>
</head>
<body>
<section class="slide" id="i1">
  <h2>판서</h2>
  <button id="tap" type="button">눌러 보기</button>
  <input id="rng" type="range" min="0" max="10" value="5" style="width:300px"> <input id="txt" type="text" size="4">
  <p>빈 곳 <a id="lnk" href="#x">링크</a></p>
</section>
<section class="slide" id="i2"><h2>둘째</h2></section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => Exploragram._internal;
const page = () => I().Ink.page;
let taps = 0;
document.getElementById('tap').addEventListener('click', () => { taps += 1; });

test('캔버스는 무대 × 배율 × 화면 밀도 크기', () => {
  const { Ink, Stage } = I();
  eq(Ink.cv.pen.width, Math.round(1280 * Stage.scale * devicePixelRatio));
  eq(Ink.cv.hl.height, Math.round(720 * Stage.scale * devicePixelRatio));
});
test('그리는 중인 펜 획은 무대 밖 맨 위 캔버스에 그려지고, 떼면 판서층으로 옮겨 비운다', async () => {
  const { Tools, Ink } = I();
  Tools.set('pen');
  const live = document.querySelector('.ch-ink-live');
  assert(live && live.parentNode === document.body, 'live canvas outside deck');
  eq(live.width, Math.round(innerWidth * devicePixelRatio));
  const lit = () => {
    const d = Ink.lctx.getImageData(0, 0, live.width, live.height).data;
    for (let i = 3; i < d.length; i += 4) if (d[i]) return true;
    return false;
  };
  ptr('pointerdown', null, 640, 600);
  ptr('pointermove', null, 700, 610);
  ptr('pointermove', null, 760, 620);
  assert(lit(), 'drawn on live canvas while drawing');
  ptr('pointerup', null, 760, 620);
  await wait(100);
  assert(!lit(), 'live canvas cleared after commit');
  const k = I().Stage.scale * devicePixelRatio;
  const px = Ink.ctx.pen.getImageData(Math.round(700 * k), Math.round(610 * k), 1, 1).data;
  assert(px[3] > 0, 'stroke on pen layer');
  Ink.undo();
  Tools.set('hand');
});
test('형광펜층은 슬라이드 글자와 곱하기로 섞인다', () => {
  const { Ink } = I();
  eq(getComputedStyle(Ink.layer).zIndex, 'auto');   // 판서층이 쌓임 맥락을 만들면 섞이지 않고 글자가 흐려진다
  eq(getComputedStyle(Ink.cv.hl).mixBlendMode, 'multiply');
});
test('손 모드에서는 그려지지 않는다', () => {
  I().Tools.set('hand');
  drag(null, [100, 300], [300, 320]);
  eq(page().length, 0);
});
test('펜으로 끌면 획 하나', () => {
  const { Tools } = I();
  Tools.set('pen');
  drag(null, [100, 300], [300, 320]);
  eq(page().length, 1);
  eq(page()[0].t, 'pen');
  eq(page()[0].c, Tools.penColor);
  eq(page()[0].w, Tools.penWidth);
  assert(page()[0].p.length >= 4, 'points');
});
test('펜을 든 채로 버튼을 톡 누르면 버튼이 눌린다', () => {
  I().Ink.lastUp = -1e9;   // 쓰다 멈춘 뒤
  I().Ink.suppressClick = false;   // 앞 테스트의 마우스 획 뒤 클릭 막기는 실제로는 같은 차례에 풀린다
  const btn = document.getElementById('tap');
  const before = page().length;
  ptr('pointerdown', btn, 200, 200);
  ptr('pointerup', btn, 200, 200);
  btn.click();
  eq(taps, 1);
  eq(page().length, before);
});
test('버튼 위에서 끌면 판서가 되고 클릭은 취소된다', () => {
  I().Ink.lastUp = -1e9;
  I().Ink.suppressClick = false;
  const btn = document.getElementById('tap');
  const before = page().length;
  drag(btn, [200, 200], [260, 240]);
  btn.click();
  eq(taps, 1);
  eq(page().length, before + 1);
});
// 화면 좌표로 보내는 포인터(슬라이더는 판서 도구일 때 꺼져 있어 무대에 보낸다)
const at = (type, cx, cy, opts) => I().Stage.deck.dispatchEvent(new PointerEvent(type, Object.assign({
  bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: cx, clientY: cy,
}, opts || {})));
test('펜으로 슬라이더 손잡이를 끌면 값이 바뀌고 판서는 생기지 않는다', () => {
  I().Ink.lastUp = -1e9;
  const rng = document.getElementById('rng');
  rng.value = '5';
  let inputs = 0, changes = 0;
  rng.oninput = () => { inputs += 1; };
  rng.onchange = () => { changes += 1; };
  eq(getComputedStyle(rng).pointerEvents, 'none');
  const r = rng.getBoundingClientRect();
  const before = page().length;
  const y = r.top + r.height / 2;
  at('pointerdown', r.left + r.width / 2, y);           // 값 5 = 가운데 손잡이
  at('pointermove', r.right - 2, y);
  at('pointerup', r.right - 2, y);
  eq(rng.value, '10');
  assert(inputs >= 1, 'input fired');
  eq(changes, 1);
  eq(page().length, before);
  rng.oninput = rng.onchange = null;
});
test('손잡이가 아닌 슬라이더 위를 지나가는 획은 판서이고 값은 그대로', () => {
  I().Ink.lastUp = -1e9;
  const rng = document.getElementById('rng');
  rng.value = '0';
  const r = rng.getBoundingClientRect();
  const before = page().length;
  const y = r.top + r.height / 2;
  at('pointerdown', r.right - 20, y - 40);
  at('pointermove', r.right - 20, y);
  at('pointermove', r.right - 60, y + 2);
  at('pointerup', r.right - 60, y + 2);
  I().Ink.lastUp = -1e9;
  at('pointerdown', r.right - 30, y);                    // 손잡이(0, 왼쪽 끝)와 먼 곳을 바로 누름
  at('pointermove', r.right - 80, y);
  at('pointerup', r.right - 80, y);
  eq(rng.value, '0');
  eq(page().length, before + 2);
});
test('쓰는 중(획을 뗀 직후)에 버튼에 닿으면 누름이 아니라 판서', async () => {
  const btn = document.getElementById('tap');
  const t0 = taps;
  drag(null, [100, 640], [160, 650]);
  const before = page().length;
  ptr('pointerdown', btn, 200, 200, { pointerType: 'touch' });
  ptr('pointerup', btn, 200, 200, { pointerType: 'touch' });
  btn.click();                                            // 터치 뒤에 늦게 오는 클릭
  eq(taps, t0);
  eq(page().length, before + 1);                          // 점 하나
  await wait(800);
  ptr('pointerdown', btn, 200, 200, { pointerType: 'touch' });
  ptr('pointerup', btn, 200, 200, { pointerType: 'touch' });
  btn.click();
  eq(taps, t0 + 1);                                       // 멈췄다 누르면 다시 버튼
});
test('장을 옮기면 쓰는 중이 끊겨 새 장의 첫 톡은 누름', async () => {
  const { Nav } = I();
  const btn = document.getElementById('tap');
  const t0 = taps;
  drag(null, [100, 640], [160, 650]);
  await wait(450);                                        // 늦은 클릭 막기(0.4초)는 지났고 쓰는 중(0.7초) 안
  Nav.go(1);
  Nav.go(0);
  const before = page().length;
  ptr('pointerdown', btn, 200, 200, { pointerType: 'touch' });
  ptr('pointerup', btn, 200, 200, { pointerType: 'touch' });
  btn.click();
  eq(taps, t0 + 1);
  eq(page().length, before);
});
test('판서 입력은 아래 요소의 포인터 처리기로 내려가지 않는다', () => {
  I().Ink.lastUp = -1e9;
  const h2 = document.querySelector('#i1 h2');
  let seen = 0;
  const count = () => { seen += 1; };
  for (const t of ['pointerdown', 'pointermove', 'pointerup']) h2.addEventListener(t, count);
  const before = page().length;
  drag(h2, [100, 60], [300, 70]);
  eq(page().length, before + 1);
  eq(seen, 0);
  for (const t of ['pointerdown', 'pointermove', 'pointerup']) h2.removeEventListener(t, count);
});
test('두 번째 손가락은 무시한다', () => {
  const before = page().length;
  ptr('pointerdown', null, 600, 300, { pointerId: 1 });
  ptr('pointerdown', null, 700, 300, { pointerId: 2 });
  ptr('pointermove', null, 700, 360, { pointerId: 2 });
  ptr('pointerup', null, 700, 360, { pointerId: 2 });
  ptr('pointermove', null, 650, 330, { pointerId: 1 });
  ptr('pointerup', null, 650, 330, { pointerId: 1 });
  eq(page().length, before + 1);
});
test('덱 밖에서 손을 떼도 획이 끝나고 다음 클릭·획은 정상', async () => {
  I().Ink.lastUp = -1e9;
  const { Ink } = I();
  const btn = document.getElementById('tap');
  const t0 = taps;
  ptr('pointerdown', btn, 200, 200);
  ptr('pointermove', btn, 260, 240);
  ptr('pointerup', document.body, 900, 700);   // 덱 밖에서 뗌
  eq(Ink.gesture, null);
  await wait(10);
  btn.click();
  eq(taps, t0 + 1);
  const before = page().length;
  drag(null, [500, 600], [600, 650]);
  eq(page().length, before + 1);
  eq(page()[page().length - 1].p.slice(0, 2), [500, 600]);
});
test('놓친 pointerup 뒤 같은 포인터로 다시 누르면 새 획', () => {
  const before = page().length;
  ptr('pointerdown', null, 700, 500);
  ptr('pointermove', null, 760, 520);   // 이 획의 pointerup을 놓쳤다
  ptr('pointerdown', null, 900, 500);
  ptr('pointermove', null, 960, 520);
  ptr('pointerup', null, 960, 520);
  eq(page().length, before + 2);
  eq(page()[page().length - 1].p.slice(0, 2), [900, 500]);
});
test('펜을 든 채로는 링크·그림의 끌어 놓기가 시작되지 않는다(늘 조작되는 요소는 그대로)', () => {
  const { Tools } = I();
  const fire = (id) => {
    const ev = new DragEvent('dragstart', { bubbles: true, cancelable: true });
    document.getElementById(id).dispatchEvent(ev);
    return ev.defaultPrevented;
  };
  eq(fire('lnk'), true);
  eq(fire('txt'), false);
  Tools.set('hand');
  eq(fire('lnk'), false);
  Tools.set('pen');
});
test('형광펜은 폭 24, 종류 hl', () => {
  I().Tools.set('hl');
  drag(null, [100, 500], [400, 500]);
  const s = page()[page().length - 1];
  eq(s.t, 'hl');
  eq(s.w, 24);
});
test('지우개로 문지르면 지워지고 되돌리기로 한 번에 복구', () => {
  const { Tools, Ink } = I();
  const before = page().length;
  Tools.set('eraser');
  drag(null, [100, 500], [400, 500]);
  eq(page().length, before - 1);
  eq(Ink.undo(), true);
  eq(page().length, before);
});
test('레이저는 저장하지 않고 1초 뒤 사라진다', async () => {
  const before = page().length;
  I().Tools.set('laser');
  drag(null, [100, 100], [300, 100]);
  eq(page().length, before);
  assert(I().Ink.laser.length > 0, 'laser points');
  await wait(1300);
  eq(I().Ink.laser.length, 0);
});
test('레이저를 누르고 있으면 멈춰 있어도 빨간 점이 보이고 떼면 사라진다', async () => {
  const { Ink, Stage } = I();
  I().Tools.set('laser');
  const red = () => {
    const k = Stage.scale * devicePixelRatio;
    const d = Ink.ctx.laser.getImageData(Math.round(640 * k), Math.round(200 * k), 1, 1).data;
    return d[0] > 200 && d[1] < 120 && d[3] > 200;
  };
  ptr('pointerdown', null, 640, 200);
  await wait(1300);                                       // 꼬리 점은 1초 뒤 사라지지만 머리 점은 남는다
  eq(Ink.laser.length, 0);
  assert(red(), 'head dot while held');
  ptr('pointerup', null, 640, 200);
  await wait(100);
  eq(Ink.laserHead, null);
  assert(!red(), 'dot gone after release');
  eq(Ink.laserRAF, 0);
});
test('장을 넘기면 그 장의 쪽으로 바뀐다', () => {
  Exploragram.go(1);
  eq(page().length, 0);
  Exploragram.go(0);
  assert(page().length > 0, 'first slide strokes back');
});
test('손바닥 지우기가 켜지면 넓은 터치는 지우개', () => {
  const { Tools, Ink } = I();
  Tools.set('pen');
  Ink.palmErase = true;
  const before = page().length;
  drag(null, [100, 300], [300, 320], { pointerType: 'touch', width: 80, height: 80 });
  eq(page().length, before - 1);
  Ink.palmErase = false;
});
test('손등 지우기: 처음엔 작게 닿다 문지르며 넓어져도 지우개로 바뀐다(그리던 선은 남지 않음)', () => {
  const { Tools, Ink } = I();
  Tools.set('pen');
  drag(null, [1100, 420], [1250, 420]);
  const before = page().length;
  Ink.palmErase = true;
  Ink.palmSize = 20;
  const o = { pointerType: 'touch', pointerId: 7 };
  ptr('pointerdown', null, 1180, 370, Object.assign({ width: 8, height: 8 }, o));
  ptr('pointermove', null, 1180, 390, Object.assign({ width: 9, height: 9 }, o));
  ptr('pointermove', null, 1180, 420, Object.assign({ width: 26, height: 22 }, o));
  ptr('pointermove', null, 1180, 440, Object.assign({ width: 26, height: 22 }, o));
  ptr('pointerup', null, 1180, 440, o);
  eq(page().length, before - 1);
  Ink.palmErase = false;
  Ink.palmSize = 0;
});
test('펜 뒤쪽 지우개(버튼 32)는 지우개', () => {
  const { Tools } = I();
  Tools.set('pen');
  drag(null, [1100, 650], [1250, 650]);
  const before = page().length;
  drag(null, [1180, 610], [1180, 690], { pointerType: 'pen', buttons: 32 });
  eq(page().length, before - 1);
});
test('빠르게 문질러 표본 사이가 벌어져도 지운다', () => {
  const { Tools } = I();
  Tools.set('pen');
  drag(null, [1000, 100], [1000, 300]);   // 세로 획
  const before = page().length;
  Tools.set('eraser');
  ptr('pointerdown', null, 950, 200);
  ptr('pointermove', null, 1050, 200);    // 두 표본 사이 100px, 세로 획은 그 가운데
  ptr('pointerup', null, 1050, 200);
  eq(page().length, before - 1);
});
test('그리면 0.5초 뒤 저장된다', async () => {
  await wait(700);
  const saved = await I().Store.get('ink:test-ink:기본');
  eq(saved.slides.i1.length, page().length);
});

test('지우다 장을 바꾸면 미완성 지우기는 취소되고 원래 획이 남는다', async () => {
  const { Session, Tools, Ink } = I();
  await Session.clearCurrent();
  Exploragram.go(0);
  Tools.set('pen');
  drag(null, [300, 300], [400, 300]);
  const original = JSON.stringify(page());
  Tools.set('eraser');
  ptr('pointerdown', null, 300, 300);
  eq(page().length, 0);
  Exploragram.go(1);
  ptr('pointerup', null, 300, 300);
  eq(page().length, 0);
  Exploragram.go(0);
  eq(JSON.stringify(page()), original);
  eq(Ink.undo(), true);
  eq(page().length, 0);
});

test('그리다 반을 바꾸면 다음 반에 미완성 획이 저장되지 않는다', async () => {
  const { Session, Tools, Ink } = I();
  await Session.clearCurrent();
  await Session.addClass('전환 확인반');
  Tools.set('pen');
  ptr('pointerdown', null, 300, 300);
  ptr('pointermove', null, 400, 300);
  await Session.switchTo('전환 확인반');
  ptr('pointerup', null, 400, 300);
  eq(Ink.gesture, null);
  eq(page().length, 0);
  await Session.switchTo('기본');
  eq(page().length, 0);
  drag(null, [300, 300], [400, 300]);
  eq(page().length, 1);
});

test('지우던 중 저장이 끝나도 취소한 획이 다시 저장된다', async () => {
  const { Session, Tools } = I();
  await Session.clearCurrent();
  Tools.set('pen');
  drag(null, [300, 300], [400, 300]);
  Tools.set('eraser');
  ptr('pointerdown', null, 300, 300);
  await wait(700); // 앞서 그린 획의 지연 저장이 지우개 입력 도중 실행됨
  eq((await I().Store.get(Session.key(Session.current))).slides.i1.length, 0);
  Exploragram.go(1);
  ptr('pointerup', null, 300, 300);
  await wait(700);
  eq((await I().Store.get(Session.key(Session.current))).slides.i1.length, 1);
  Exploragram.go(0);
});

test('완성된 획이 없어도 되돌리기·지우기는 미완성 펜 흔적을 지운다', async () => {
  const { Session, Tools, Ink } = I();
  const alpha = () => {                       // 그리는 중인 펜은 맨 위 캔버스에, 끝난 획은 판서층에
    const ratio = Ink.cv.pen.width / 1280;
    const r = I().Stage.deck.getBoundingClientRect();
    const dpr = devicePixelRatio;
    const live = Ink.lctx.getImageData(Math.round((r.left + 350 * r.width / 1280) * dpr), Math.round((r.top + 300 * r.height / 720) * dpr), 1, 1).data[3];
    return live + Ink.ctx.pen.getImageData(Math.round(350 * ratio), Math.round(300 * ratio), 1, 1).data[3];
  };
  for (const method of ['undo', 'clear']) {
    await Session.clearCurrent();
    Tools.set('pen');
    ptr('pointerdown', null, 300, 300);
    ptr('pointermove', null, 400, 300);
    assert(alpha() > 0, 'live pen preview');
    eq(Ink[method](), false);
    eq(alpha(), 0);
    eq(Ink.gesture, null);
  }
});
</script>
</body>
</html>
