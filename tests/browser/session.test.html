<!doctype html>
<html lang="ko" data-deck="test-session">
<head>
<meta charset="utf-8">
<title>session</title>
<link rel="stylesheet" href="../../engine/exploragram.css">
<script defer src="../../engine/exploragram.js"></script>
<script src="harness.js"></script>
</head>
<body>
<section class="slide" id="a"><h2>하나</h2></section>
<pre id="results" data-summary="pending"></pre>
<script>
const I = () => ClassHTML._internal;
const stroke = (t) => ({ t, c: t === 'hl' ? '#FFE45C' : '#000000', w: t === 'hl' ? 24 : 3, p: [1, 1, 5, 5] });
// 판서층이 화면에 보이는 슬라이드의 빈 배열을 미리 만들 수 있으므로, 획이 있는 슬라이드만 센다.
const inked = (doc) => Object.values(doc.slides).filter((a) => a.length).length;

test('저장소는 IndexedDB', () => { eq(I().Store.backend, 'idb'); });
test('처음에는 기본 반 하나, 덱 이름은 data-deck', () => {
  eq(I().Session.classes, ['기본']);
  eq(I().Session.current, '기본');
  eq(I().Session.deck, 'test-session');
});
test('반 추가: 빈 이름·중복은 거절', async () => {
  const S = I().Session;
  eq(await S.addClass('  2반  '), true);
  eq(await S.addClass('2반'), false);
  eq(await S.addClass('   '), false);
  eq(S.classes, ['기본', '2반']);
});
test('반을 바꿔도 각자의 판서가 남는다', async () => {
  const { Session: S, InkModel: M } = I();
  M.add(S.hist, M.page(S.doc, { kind: 'slide', key: 'a' }), stroke('pen'));
  S.changed();
  await S.switchTo('2반');
  eq(S.current, '2반');
  eq(inked(S.doc), 0);
  await S.switchTo('기본');
  eq(S.doc.slides.a.length, 1);
});
test('지연 저장은 0.5초 뒤 저장소에 쓴다', async () => {
  const { Session: S, Store: St, InkModel: M } = I();
  M.add(S.hist, M.page(S.doc, { kind: 'slide', key: 'b' }), stroke('hl'));
  S.changed();
  await wait(700);
  const saved = await St.get('ink:test-session:기본');
  eq(saved.slides.b.length, 1);
});
test('session 이벤트가 문서 교체를 알린다', async () => {
  let n = 0;
  I().on('session', () => { n += 1; });
  await I().Session.switchTo('2반');
  await I().Session.switchTo('기본');
  eq(n, 2);
});
test('백업 내보내기 → 비우기 → 불러오기', async () => {
  const S = I().Session;
  const text = await S.exportBackup();
  await S.clearCurrent();
  eq(inked(S.doc), 0);
  const r = await S.importBackup(text);
  eq(r.ok, true);
  eq(S.doc.slides.a.length, 1);
  eq((await S.importBackup('{"app":"x"}')).ok, false);
});
test('반을 바꾸는 도중 저장이 끼어들어도 다른 반 키에 쓰지 않는다', async () => {
  const { Session: S, Store: St, InkModel: M } = I();
  M.add(S.hist, M.page(S.doc, { kind: 'slide', key: 'z' }), stroke('pen'));   // 기본 반에만 그린다
  const get = St.get;
  St.get = (k) => wait(300).then(() => get.call(St, k));   // 느린 디스크
  const p = S.switchTo('2반');
  while (S.current !== '2반') await wait(5);
  await S.flush();   // 바꾸는 도중 창 숨김
  await p;
  St.get = get;
  eq(inked(await S.load('2반')), 0);
  eq((await S.load('기본')).slides.z.length, 1);
});
test('반 삭제: 지운 반의 판서도 지우고, 마지막 하나는 못 지운다', async () => {
  const { Session: S, Store: St } = I();
  await S.switchTo('2반');
  eq(await S.removeClass('2반'), true);
  eq(S.classes, ['기본']);
  eq(S.current, '기본');
  eq(await St.get('ink:test-session:2반'), undefined);
  eq(await S.removeClass('기본'), false);
});
test('반을 지우는 도중 저장이 끼어들어도 지운 반 판서가 되살아나지 않는다', async () => {
  const { Session: S, Store: St, InkModel: M } = I();
  await S.addClass('3반');
  await S.switchTo('3반');
  M.add(S.hist, M.page(S.doc, { kind: 'slide', key: 'r' }), stroke('pen'));
  const get = St.get;
  St.get = (k) => wait(300).then(() => get.call(St, k));   // 느린 디스크
  const p = S.removeClass('3반');
  while (S.classes.includes('3반')) await wait(5);
  await S.flush();   // 지우는 도중 창 숨김
  await p;
  St.get = get;
  await S.flush();
  eq(S.current, '기본');
  eq(await St.get('ink:test-session:3반'), undefined);
});
test('저장이 실패해도 백업 내보내기는 된다', async () => {
  const { Session: S, Store: St, InkModel: M } = I();
  M.add(S.hist, M.page(S.doc, { kind: 'slide', key: 'q' }), stroke('pen'));
  const setItem = Storage.prototype.setItem;
  Storage.prototype.setItem = () => { throw new DOMException('가득 참', 'QuotaExceededError'); };
  St.backend = 'local';
  try {
    eq(await St.set('t', 1), false);
    eq(M.parseBackup(await S.exportBackup()).classes['기본'].slides.q.length, 1);
  } finally {
    Storage.prototype.setItem = setItem;
    St.backend = 'idb';
  }
});
test('저장이 계속 실패해도 반을 오가는 동안 판서를 잃지 않는다', async () => {
  const { Session: S, Store: St, InkModel: M } = I();
  await S.addClass('5반');
  const setItem = Storage.prototype.setItem;
  Storage.prototype.setItem = () => { throw new DOMException('가득 참', 'QuotaExceededError'); };
  St.backend = 'local';
  try {
    M.add(S.hist, M.page(S.doc, { kind: 'slide', key: 'u' }), stroke('pen'));   // 기본 반
    await S.switchTo('5반');
    await S.switchTo('기본');
    eq(S.doc.slides.u.length, 1);
  } finally {
    Storage.prototype.setItem = setItem;
    St.backend = 'idb';
  }
});
test('저장소의 반 목록이 깨져 있어도 정리해서 쓴다', async () => {
  const { Session: S, Store: St } = I();
  await St.set('classes', { list: ['A', 'A', '__proto__', '  ', 5, 'x'.repeat(21), 'B'], current: 'zzz' });
  await St.set('ink:test-session:A', { slides: 'broken', boards: 7 });
  await S.init();   // 저장소에서 다시 읽는다
  eq(S.classes, ['A', 'B']);
  eq(S.current, 'A');
  eq(S.doc.boards.length, 1);
});
</script>
</body>
</html>
